<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>10 buy year！</title>
    <meta name="description" content="仮想通貨で借金を背負ったクリスが、家の不用品を売るところから始めて10年の転売キャリアを歩む育成シミュレーション。My Crypto Heroes のアセットを使った二次創作ゲームです。" />
    <link rel="icon" href="assets/icons/gum.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Orbitron:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div id="app">
      <section id="title-screen" class="screen" hidden></section>

      <section id="game-screen" class="screen" hidden>
        <header id="hud"></header>
        <div id="stage">
          <img id="stage-bg" alt="" />
          <div id="news-ticker" aria-live="polite"></div>
          <img id="sprite-left" class="sprite" alt="" />
          <img id="sprite-right" class="sprite" alt="" />
          <div id="loot" aria-live="polite"></div>
          <div id="side">
            <div id="params" aria-label="経験点"></div>
            <nav id="side-btns"></nav>
          </div>
        </div>
        <div id="message">
          <div id="speaker"></div>
          <div id="text"></div>
          <div id="choices"></div>
          <div id="next-mark">▼</div>
        </div>
        <nav id="commands"></nav>
      </section>

      <section id="ending-screen" class="screen" hidden></section>
    </div>
    <div id="modal-root"></div>
    <noscript>このゲームを遊ぶには JavaScript を有効にしてください。</noscript>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
